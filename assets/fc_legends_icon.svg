  </g>
  <text x="514" y="792" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="20" fill="#b8ebff" opacity="0.88">LEGENDS</text>
